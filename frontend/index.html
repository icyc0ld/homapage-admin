<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Homepage Admin</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="container">
    <header>
      <h1>Homepage Admin</h1>
      <p class="subtitle">轻量化管理后台 · 连接任意 Docker 中的 homepage 容器</p>
    </header>

    <main>
      <section class="card">
        <div class="section-header">
          <h2>服务器列表</h2>
          <button id="btn-add" class="btn btn-primary">添加服务器</button>
        </div>
        <div id="server-list" class="server-list">
          <p class="empty">暂无服务器</p>
        </div>
      </section>

      <section id="form-section" class="card hidden">
        <h2 id="form-title">添加服务器</h2>
        <form id="server-form">
          <input type="hidden" id="server-id" />
          <div class="form-group">
            <label for="name">名称</label>
            <input type="text" id="name" name="name" placeholder="例如：家庭 NAS" required />
          </div>
          <div class="form-group">
            <label for="baseUrl">地址</label>
            <input type="url" id="baseUrl" name="baseUrl" placeholder="http://192.168.1.10:3000" required />
            <span class="hint">homepage 容器的访问地址，不需要 /api/healthcheck 后缀</span>
          </div>
          <div class="form-group">
            <label for="description">备注</label>
            <input type="text" id="description" name="description" placeholder="可选" />
          </div>
          <div id="check-result" class="check-result hidden"></div>
          <div class="form-actions">
            <button type="button" id="btn-test" class="btn btn-secondary">测试连接</button>
            <button type="submit" class="btn btn-primary">保存</button>
            <button type="button" id="btn-cancel" class="btn btn-ghost">取消</button>
          </div>
        </form>
      </section>
    </main>

    <footer>
      <p>Homepage Admin · 前后端分离 · 轻量化 · 可迁移</p>
    </footer>
  </div>

  <script src="/js/app.js"></script>
</body>
</html>
