<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Homepage Admin · v3</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <canvas id="particle-canvas"></canvas>
  <div class="bg-texture"></div>

  <div id="app" class="app">
    <header class="app-header">
      <div class="brand">
        <div class="brand-icon">H</div>
        <div class="brand-text">
          <h1>Homepage Admin</h1>
          <p>轻量化 homepage 管理后台</p>
        </div>
      </div>
      <button id="btn-add" class="btn btn-primary">
        <span>+</span>
        <span>添加服务器</span>
      </button>
    </header>

    <main>
      <section class="stats-grid" aria-label="概览">
        <div class="stat-card">
          <p class="stat-value" id="stat-total">0</p>
          <p class="stat-label">服务器总数</p>
        </div>
        <div class="stat-card">
          <p class="stat-value" id="stat-online">0</p>
          <p class="stat-label">在线</p>
        </div>
        <div class="stat-card">
          <p class="stat-value" id="stat-offline">0</p>
          <p class="stat-label">离线 / 未检测</p>
        </div>
      </section>

      <section class="card">
        <div class="card-header">
          <h2>服务器列表</h2>
        </div>
        <div id="server-list" class="server-list">
          <div class="empty-state">
            <div class="empty-state-icon">
              <svg viewBox="0 0 24 24" width="48" height="48" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
                <circle cx="12" cy="12" r="2"/>
                <path d="M8.5 8.5C7.1 9.9 6.3 11.4 6.3 12s.8 2.1 2.2 3.5"/>
                <path d="M5.1 5.1C2.7 7.5 1.5 9.8 1.5 12s1.2 4.5 3.6 6.9"/>
                <path d="M15.5 8.5c1.4 1.4 2.2 2.9 2.2 3.5s-.8 2.1-2.2 3.5"/>
                <path d="M18.9 5.1c2.4 2.4 3.6 4.7 3.6 6.9s-1.2 4.5-3.6 6.9"/>
              </svg>
            </div>
            <p>暂无服务器，点击右上角添加</p>
          </div>
        </div>
      </section>
    </main>

    <footer class="app-footer">
      <p>Homepage Admin v3 · 前后端分离 · 轻量 · 可迁移</p>
    </footer>
  </div>

  <!-- Config Editor View -->
  <div id="config-editor-view" class="config-editor-view hidden">
    <header class="app-header config-editor-header">
      <div class="brand">
        <button id="btn-back" class="btn btn-ghost btn-small">← 返回</button>
        <div class="brand-text">
          <h1 id="config-server-name">配置 Homepage</h1>
          <p>图形化编辑布局、小部件与功能</p>
        </div>
      </div>
      <div class="config-actions">
        <button id="btn-import" class="btn btn-secondary">从服务器导入</button>
        <button id="btn-export" class="btn btn-secondary">导出 YAML</button>
        <button id="btn-sync" class="btn btn-primary">同步到 Homepage</button>
        <button id="btn-save-config" class="btn btn-primary">保存配置</button>
      </div>
    </header>

    <div class="config-editor-body">
      <aside class="config-tabs">
        <button class="config-tab active" data-tab="settings">设置</button>
        <button class="config-tab" data-tab="widgets">小部件</button>
        <button class="config-tab" data-tab="services">服务</button>
        <button class="config-tab" data-tab="bookmarks">书签</button>
        <button class="config-tab" data-tab="layout">布局</button>
      </aside>

      <section class="config-panel active" id="panel-settings">
        <div class="card">
          <div class="card-header"><h2>全局设置</h2></div>
          <div id="settings-form" class="config-form"></div>
        </div>
      </section>

      <section class="config-panel" id="panel-widgets">
        <div class="card">
          <div class="card-header"><h2>信息小部件</h2><button id="btn-add-widget" class="btn btn-primary btn-small">+ 添加</button></div>
          <div id="widgets-list" class="config-list"></div>
        </div>
      </section>

      <section class="config-panel" id="panel-services">
        <div class="card">
          <div class="card-header"><h2>服务分组</h2><button id="btn-add-group" class="btn btn-primary btn-small">+ 添加分组</button></div>
          <div id="services-list" class="config-group-list"></div>
        </div>
      </section>

      <section class="config-panel" id="panel-bookmarks">
        <div class="card">
          <div class="card-header"><h2>书签分组</h2><button id="btn-add-bookmark-group" class="btn btn-primary btn-small">+ 添加分组</button></div>
          <div id="bookmarks-list" class="config-group-list"></div>
        </div>
      </section>

      <section class="config-panel" id="panel-layout">
        <div class="card">
          <div class="card-header"><h2>分组布局</h2></div>
          <div id="layout-list" class="config-list"></div>
        </div>
      </section>
    </div>
  </div>

  <!-- Modal -->
  <div id="modal-overlay" class="modal-overlay" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal-header">
        <h2 id="modal-title">添加服务器</h2>
        <button id="modal-close" class="modal-close" aria-label="关闭">×</button>
      </div>
      <div class="modal-body">
        <form id="server-form">
          <input type="hidden" id="server-id" />
          <div class="form-group">
            <label for="name">名称</label>
            <input type="text" id="name" name="name" placeholder="例如：家庭 NAS" required />
          </div>
          <div class="form-group">
            <label for="baseUrl">地址</label>
            <input type="url" id="baseUrl" name="baseUrl" placeholder="http://192.168.1.10:3000" required />
            <span class="hint">homepage 容器的访问地址，不需要 /api/healthcheck 后缀</span>
          </div>
          <div class="form-group">
            <label for="description">备注</label>
            <input type="text" id="description" name="description" placeholder="可选" />
          </div>
          <div id="check-result" class="check-result hidden"></div>
          <div class="form-actions">
            <button type="button" id="btn-test" class="btn btn-secondary">测试连接</button>
            <button type="submit" id="btn-submit" class="btn btn-primary">保存</button>
            <button type="button" id="btn-cancel" class="btn btn-ghost">取消</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Toast container -->
  <div id="toast-container" class="toast-container"></div>

  <script src="/js/particles.js"></script>
  <script src="/js/config-editor.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
